name: windows-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -x --deselect tests/test_bdmv.py::TestLibblurayConformance::test_ffmpeg_accepts_tree

      - name: Build OpticRip.exe bundle
        run: pyinstaller packaging/opticrip-win.spec --noconfirm

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpticRip-windows
          path: dist/OpticRip/
          if-no-files-found: error
